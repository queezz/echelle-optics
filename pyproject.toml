[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "echelle_optics"
version = "0.1.0"
description = "Spectrometer optics, dispersion, and geometry utilities"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Arseniy Kuzmin", email = "arseniy@example.com" }]
license = { text = "MIT" }
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "plotly>=5.20",
  "pandas>=2.2",
  "astropy>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4.0",
  "black>=24.3.0",
  "mypy>=1.8.0",
  "ipython",
  "ipykernel",
  "jupyter>=1.0",
  "nbconvert>=7.0",
  "nbformat>=5.9",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.6",
  "mkdocstrings[python]>=0.25",
  "pymdown-extensions>=10.0",
  "mdx_truly_sane_lists>=1.3",
  "mkdocs-glightbox",
]

[project.urls]
Homepage = "https://github.com/queezz/echelle_optics"
Repository = "https://github.com/queezz/echelle_optics"
Issues = "https://github.com/queezz/echelle_optics/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
echelle_optics = ["data/*.txt"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
lint.select = ["E","F","I","B","UP","W","C90"]
lint.ignore = ["E203","E266","E501"]
src = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
