site_name: echelle_optics
site_description: Spectrometer optics, dispersion, and geometry utilities
repo_url: https://github.com/queezz/echelle_optics
repo_name: queezz/echelle_optics
docs_dir: docs

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.top
    - content.code.copy
    - content.image.zoom
  palette:
    - scheme: custom-dark
      primary: custom
      accent: yellow
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

plugins:
  - search
  - glightbox
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - mdx_truly_sane_lists:
      nested_indent: 4
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - styles/brand.css

nav:
  - Home: index.md
  - Guide:
      - Getting Started: guide/getting_started.md
      - Echelle Physics: guide/echelle_physics.md
      - Detector Geometry: guide/detector_geometry.md
      - Synthetic Images: guide/synthetic_images.md
      - Architecture: guide/architecture.md
  - Examples:
      - Overview: examples/index.md
      - Order Table: examples/order_table.md
      - Dispersion Intuition: examples/dispersion_intuition.md
      - Synthetic Lamp Image: examples/synthetic_lamp.md
      - Synthetic Image Parameters: examples/synthetic_parameters.md
      - Detector Geometry: examples/detector_geometry.md
  - Development:
      - Agent Notes: development/agent_notes.md
      - Future Work: development/future_work.md
  - API Reference: reference.md
